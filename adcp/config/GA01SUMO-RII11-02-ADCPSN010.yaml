# ── Instrument identity ───────────────────────────────────────────────────────
refdes:     GA01SUMO-RII11-02-ADCPSN010
ctd_refdes: GA01SUMO-RII11-02-CTDMOQ017

# ── OOINet data streams ───────────────────────────────────────────────────────
streams:
  telemetered:    adcps_jln_stc_instrument
  recovered_host: adcps_jln_stc_instrument_recovered
  recovered_inst: adcp_velocity_earth

streams_meta:
  telemetered:    adcps_jln_stc_metadata
  recovered_host: adcps_jln_stc_metadata_recovered
  recovered_inst: adcp_engineering

ctd_streams:
  telemetered:    ctdmo_ghqr_imodem_instrument
  recovered_host: ctdmo_ghqr_imodem_instrument_recovered
  recovered_inst: ctdmo_ghqr_instrument_recovered

# ── Deployments ───────────────────────────────────────────────────────────────
# List deployment numbers to exclude from processing (e.g. incomplete metadata)
deployments_to_drop: []

# ── Depth regridding ──────────────────────────────────────────────────────────
regrid:
  depth_min:  0      # m
  depth_max:  500    # m
  depth_step: 10     # m

# ── Bottle matching ───────────────────────────────────────────────────────────
# Regex pattern (case-insensitive) matched against the 'Target Asset' column
# of the water-sampling CSV to identify samples from this mooring.
mooring_pattern: "SUMO"
comparison_window: "6h"    # pandas Timedelta string, e.g. "1h", "30min", "4h"

# ── QC thresholds ─────────────────────────────────────────────────────────────
qc:
  # Bottle/CTD matching
  mooring_pressure:        500.0   # dbar — nominal instrument depth
  mooring_pressure_window: 100.0   # ± dbar tolerance for bottle matching

  # TRDI instrument QC (ADCP Longranger 75 kHz, 10 m cells, 80-ping ensemble)
  correlation_good:       115      # counts — above = good
  correlation_suspect:    63       # counts — above = suspect, below = fail
  percent_good_good:      100      # percent — above = good
  percent_good_suspect:   98       # percent — above = suspect, below = fail
  error_velocity_suspect: 0.036    # m/s  (3.6 cm/s)
  error_velocity_fail:    0.072    # m/s  (7.2 cm/s)

  # QARTOD gross range — instrument orientation
  roll_fail_range:    [-2000, 2000]    # cdegrees (converted to degrees in processing)
  roll_suspect_range: [-1500, 1500]
  pitch_fail_range:   [-2000, 2000]
  pitch_suspect_range: [-1500, 1500]

  # QARTOD gross range — scalar CTD variables
  temperature_fail_range: [-5,  35]   # °C
  salinity_fail_range:    [0,   42]   # PSU

  # QARTOD gross range — velocity (applied via WOA depth bins)
  velocity_fail_range: [-5, 5]        # m/s
  velocity_suspect_std: 3             # number of std devs for suspect threshold

  # Climatology test — number of std devs for suspect threshold
  climatology_suspect_std: 2

# ── Output paths ──────────────────────────────────────────────────────────────
paths:
  data_dir:    data/
  results_dir: results/